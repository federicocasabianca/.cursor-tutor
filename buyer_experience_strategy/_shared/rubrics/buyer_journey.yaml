# Canonical buyer journey phases & structural layers (catalog)
# Scope: Awareness → First Use. Post–first purchase retention/engagement handled by a separate pod.
# Handoff: after successful order AND first use.
# IDs are stable; adjust labels/descriptions as needed.

markets:
  allowed:
    - DACH
  default: DACH

phases:
  - id: awareness_discovery
    label: Awareness / Discovery
    description: >
      First contact with the marketplace; the user realizes a need and discovers eduki
      via search engines, social, ads, or word of mouth. They land on LPs, home, product pages,
      or app store listings.
    structural_layers:
      - id: acquisition_channels
        label: Acquisition Channels
        examples: [SEO, Paid, Referrals]
      - id: landing_page_ux
        label: Landing Page UX
        examples: [Home Page, Material Page, Product Page, App Store Listing]
      - id: app_install_prompting
        label: App Install Prompting
        examples: []
      - id: onboarding
        label: Onboarding
        examples: []

  - id: explore_passive_looking
    label: Explore / Passive Looking
    description: >
      User browses or searches for materials; uses filters and navigation to discover content.
      Includes wishlist and author pages; may include blog/newsletters.
    structural_layers:
      - id: search_relevance
        label: Search Relevance
        examples: [Match Quality, Ranking]
      - id: refinement
        label: Refinement
        examples: [Filters, Categories]
      - id: navigation
        label: Navigation
        examples: [Home→Search, Home→Material, Home→Author, Home→Blog]
      - id: material_page
        label: Material Page
        examples: []
      - id: wishlist
        label: Wishlist
        examples: []

  - id: intent_decision
    label: Intent / Decision
    description: >
      Strong consideration phase; compares items, adds to cart, reads/likes reviews, and views
      recommendations/similar items.
    structural_layers:
      - id: quality_signals
        label: Quality Signals & Metadata
        examples: [Ratings & Reviews, Visual Cues, Quality Framework]
      - id: free_download
        label: Free Download
        examples: []
      - id: cart_page
        label: Cart Page
        examples: []
      - id: upsell_cross_sell
        label: Upsell / Cross-sell
        examples: [Similar, Bought Together, Recommended]
      - id: sale_items
        label: Sale Items
        examples: []
      - id: pricing_transparency
        label: Pricing Transparency
        examples: [Bundles, Voucher Logic]

  - id: purchase_conversion
    label: Purchase / Conversion
    description: >
      Checkout and payment steps to complete the transaction.
    structural_layers:
      - id: checkout_page
        label: Checkout Page
        examples: []
      - id: payment
        label: Payment Page / Methods
        examples: []

  - id: first_use
    label: First Use
    description: >
      Realization moment where expectations meet reality; download/access material and rate/review.
    structural_layers:
      - id: content_of_download
        label: Content of the Download
        examples: []
      - id: instructions_of_use
        label: Instructions of Use
        examples: []
      - id: satisfaction
        label: Satisfaction
        examples: []