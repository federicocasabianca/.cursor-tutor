# Canonical buyer segments (catalog)
segments:
  - id: lead_freemium
    label: Lead Freemium Buyer
    definition: Signed-up + at least 1 FD in the lifetime (has placed 0 paid purchases).
  - id: lead_new_signup
    label: Lead New Signup Buyer
    definition: Signed-up < 30 days ago (has placed 0 paid purchases and 0 FD).
  - id: lead_not_activated
    label: Lead Not Activated Buyer
    definition: Signed-up > 30 days ago (has placed 0 paid purchases and 0 FD).
  - id: active_1_time_buyer
    label: Active 1 Time Buyer
    definition: First paid purchase < 30 days ago (total paid purchases = 1).
  - id: active_slow_buyer
    label: Active Slow Buyer
    definition: Last paid purchase < 30 days ago (total paid purchases = 2–5).
  - id: active_normal_buyer
    label: Active Normal Buyer
    definition: Last paid purchase < 30 days ago (total paid purchases = 6–11).
  - id: active_heavy_buyer
    label: Active Heavy Buyer
    definition: Last paid purchase < 30 days ago (total paid purchases = 12–23).
  - id: active_loyal_buyer
    label: Active Loyal Buyer
    definition: Last paid purchase < 30 days ago (total paid purchases >= 24).
  - id: inactive_1_time_buyer
    label: Inactive 1 Time Buyer
    definition: Last paid purchase > 30 days and < 180 days ago (total paid purchases = 1).
  - id: inactive_slow_buyer
    label: Inactive Slow Buyer
    definition: Last paid purchase > 30 days and < 180 days ago (total paid purchases = 2–5).
  - id: inactive_normal_buyer
    label: Inactive Normal Buyer
    definition: Last paid purchase > 30 days and < 180 days ago (total paid purchases = 6–11).
  - id: inactive_heavy_buyer
    label: Inactive Heavy Buyer
    definition: Last paid purchase > 30 days and < 180 days ago (total paid purchases = 12–23).
  - id: inactive_loyal_buyer
    label: Inactive Loyal Buyer
    definition: Last paid purchase > 30 days and < 180 days ago (total paid purchases >= 24).
  - id: churned_1_time_buyer
    label: Churned 1 Time Buyer
    definition: First paid purchase > 180 days ago (total paid purchases = 1).
  - id: churned_slow_buyer
    label: Churned Slow Buyer
    definition: Last paid purchase > 180 days ago (total paid purchases = 2–5).
  - id: churned_normal_buyer
    label: Churned Normal Buyer
    definition: Last paid purchase > 180 days ago (total paid purchases = 6–11).
  - id: churned_heavy_buyer
    label: Churned Heavy Buyer
    definition: Last paid purchase > 180 days ago (total paid purchases = 12–23).
  - id: churned_loyal_buyer
    label: Churned Loyal Buyer
    definition: Last paid purchase > 180 days ago (total paid purchases >= 24).
